      synopsis: Red Hat build of Cluster Observability Operator 1.3.0 release
      description: |
        Incident detection feature reaches General Availability
        The incident detection feature in the Cluster Observability Operator reaches General Availability (GA) status in this release. Incident detection simplifies observability by grouping related alerts into incidents. This helps reduce alert fatigue and allows you to focus on the root cause of a problem. With General Availability (GA) status, the incident detection feature is production-ready and fully supported for enterprise deployments. Users can enable incident detection through the monitoring UIPlugin resource by setting spec.monitoring.incidents.enabled: true.

        For more information, see Incident detection

        COO-1281

        Incidents view supports silenced alerts
        The incidents view in the monitoring UI plugin supports silenced alerts in this release. Silenced alerts display with a state of Silenced in the incident detection UI and appear in a lighter color in the timeline. This helps you to distinguish them from active alerts and to understand the complete state of your cluster observability signals.

        COO-1280

        End-to-end observability with ClusterObservability custom resource
        The Cluster Observability Operator provides a ClusterObservability custom resource for deploying end-to-end observability with minimal configuration as a Technology Preview feature. The ClusterObservability custom resource simplifies the deployment of logging, tracing, and OpenTelemetry capabilities by automatically managing operator installation, storage configuration, and UI integration.
