apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: get-submodule-commit-labels
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: >-
    This task retrieves the commit info of git submodules in the repository.
  params:
    - name: SOURCE-ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with the application source code.
      type: string
      default: ""
    - name: DOCKERFILE
      description: dockerfile used to build the component.
      type: string
      default: ""
  results:
    - name: labels
      type: array
      description: LABELS array for buildah
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:a246cf2267fe6fa68ae8885c6ca4141923edca3ccf9b56838d1ebe369d31b46d
      args:
        - use
        - $(params.SOURCE-ARTIFACT)=/tekton/home/source
    - name: get-submodule-sha
      image: quay.io/konflux-ci/buildah-task@sha256:4c470b5a153c4acd14bf4f8731b5e36c61d7faafe09c2bf376bb81ce84aa5709
      workingDir: /tekton/home/source
      script: |
        #!/bin/bash
        set -euo pipefail

        # Initialize variables
        dockerfile="$(params.DOCKERFILE)"
        submodule=""
        submodule_sha=""
        submodule_url=""

        # Set submodule-name according to dockerfile
        echo "dockerfile_name=${dockerfile}"
        submodule=$(grep -m 1 COPY ${dockerfile}|awk '{print $2}'|awk -F/ '{print $1}')
        echo "submodule_name=${submodule}"

        # Get the commit SHA from the git index
        cd ${submodule}
        submodule_sha=$(git rev-parse HEAD)
        submodule_url=$(git remote get-url origin)
        submodule_commit_url=${submodule_url%.git}/commit/${submodule_sha}

        # Write results
        echo "$submodule_commit_url"
        printf '["commit.id=%s", "commit.url=%s"]' "${submodule_sha}" "${submodule_commit_url}" > $(results.labels.path)

        echo -e "\nSubmodule commit SHAs extracted successfully"
