apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: get-submodule-commit-sha
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: >-
    This task retrieves the commit SHA of git submodules in the repository.
  params:
    - name: source-artifact
      description: The Trusted Artifact URI pointing to the artifact with the application source code.
      type: string
      default: ""
    - name: component-name
      description: name of the specific submodule.
      type: string
      default: ""
  results:
    - name: labels
      type: array
      description: LABELS array for buildah
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:15d7dc86012e41b10d1eb37679ec03ee75c96436224fadd0938a49dc537aa4ad
      args:
        - use
        - $(params.source-artifact)=/tekton/home/source
    - name: get-submodule-sha
      image: quay.io/konflux-ci/buildah-task:4c470b5a153c4acd14bf4f8731b5e36c61d7faafe09c2bf376bb81ce84aa5709
      workingDir: /tekton/home/source
      script: |
        #!/bin/bash
        set -e

        # Initialize variables
        component_name="$(params.component-name)"
        submodule=""
        submodule_sha=""
        submodule_url=""

        # Set submodule-name according to component name
        echo "component_name=${component_name}"
        submodule=${component_name}
        if [[ "$component_name" == "cluster-observability-operator" ]]; then
          submodule="observability-operator"
        fi
        if [[ "$component_name" == "dashboards-console-plugin" ]]; then
          submodule="ui-dashboards"
        fi
        if [[ "$component_name" == "distributed-tracing-console-plugin" ]]; then
          submodule="ui-distributed-tracing"
        fi
        if [[ "$component_name" == "distributed-tracing-console-plugin-pf4" ]]; then
          submodule="ui-distributed-tracing-pf4"
        fi
        if [[ "$component_name" == "distributed-tracing-console-plugin-pf5" ]]; then
          submodule="ui-distributed-tracing-pf5"
        fi
        if [[ "$component_name" == "logging-console-plugin" ]]; then
          submodule="ui-logging"
        fi
        if [[ "$component_name" == "logging-console-plugin-pf4" ]]; then
          submodule="ui-logging-pf4"
        fi
        if [[ "$component_name" == "monitoring-console-plugin" ]]; then
          submodule="ui-monitoring"
        fi
        if [[ "$component_name" == "monitoring-console-plugin-pf5" ]]; then
          submodule="ui-monitoring-pf5"
        fi
        if [[ "$component_name" == "obo-prometheus-operator-admission-webhook" ]]; then
          submodule="obo-prometheus-operator"
        fi
        if [[ "$component_name" == "obo-prometheus-operator-prometheus-config-reloader" ]]; then
          submodule="obo-prometheus-operator"
        fi
        if [[ "$component_name" == "troubleshooting-panel-console-plugin" ]]; then
          submodule="ui-troubleshooting-panel"
        fi
        echo "submodule_name=${submodule}"
        cd ${submodule}
        # Get the commit SHA from the git index
        submodule_sha=$(git rev-parse HEAD)
        submodule_url=$(git remote get-url origin)
        submodule_commit_url=${submodule_url}/commit/${submodule_sha}

        # Write results
        echo "$submodule_commit_url"
        printf '["commit.id=%s", "commit.url=%s"]' "${submodule_sha}" "${submodule_commit_url}" > $(results.labels.path)

        echo -e "\nSubmodule commit SHAs extracted successfully"
